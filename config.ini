# 标记 Git 跳过这个文件的工作区修改
# 在项目目录用Git Bash执行：（推荐前者）
# git update-index --skip-worktree config.ini // 通知git忽略该文件的修改，除非取消，否则git不会显示该或提交该文件的改动。
# 或 git update-index --assume-unchanged config.ini // 检查该文件无变化，不检查改动

# 恢复改动： 
# git update-index --no-skip-worktree config.ini
# git update-index --no-assume-unchanged config.ini


